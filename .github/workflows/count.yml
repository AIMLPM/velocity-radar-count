# Velocity Radar count. This one file is all of the code that runs in your account.
#
# WHAT IT ASKS GITHUB FOR. The commits YOU authored on the default branch of the repositories your token can
# read. For each commit, five things: its id, its date, the first line of its message, the lines it added and
# removed, and how many parents it has. Never a file, a diff, a full message or anyone else's commits.
#
# WHAT LEAVES YOUR ACCOUNT TODAY. Nothing. Sending is not open yet. The totals are shown in your own run.
# When sending opens it will be a new release of this file, and you would have to change the commit id in
# your own file to use it.
#
# WHAT JOB 1 HANDS TO JOB 2. Totals by day, a table for the last 30, 90, 180 and 365 days, your longest run
# and longest stretch of commits, and how your commits spread over the hours of the day. No repository
# names, no commit ids, no message text. The only commit times handed on are where your longest run and
# longest stretch begin and end.
#
# WHY TWO JOBS. "count" holds your token and has no permission to ask GitHub for a signed run token.
# "witness" can ask for that signed token and never sees yours. It uses no outside actions and no packages.
name: Velocity Radar count

on:
  workflow_call:
    inputs:
      timezone:
        description: Optional. A region name such as America/Los_Angeles. GitHub reports commit times in UTC only.
        type: string
        required: false
        default: ""
    secrets:
      VELOCITY_RADAR_TOKEN:
        description: A read-only, short-lived fine-grained token for the repositories you chose
        required: true

jobs:
  count:
    name: Count (holds your token, sends nothing)
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      totals: ${{ steps.count.outputs.totals }}
    steps:
      - id: count
        name: Add up your commits
        env:
          VELOCITY_RADAR_TOKEN: ${{ secrets.VELOCITY_RADAR_TOKEN }}
          TIMEZONE: ${{ inputs.timezone }}
        run: |
          python3 - <<'PY'
          import base64, collections, datetime as dt, gzip, json, os, re, statistics, sys, time
          import urllib.error, urllib.request
          from zoneinfo import ZoneInfo

          # ---- 1. SETTINGS ------------------------------------------------------------------------------
          # The two patterns are copied, character for character, from Velocity Radar's locked measures.py.
          METHOD_VERSION = 3
          AUTO = re.compile(r"^(chore|build|ci|release|bump|deploy|sync|publish|version|merge|revert|update (readme|deps|dependencies|changelog|lock)|\[?bot\]?|auto|evidence|logs?[:/]|test-?runs?|record(ed)? (run|evidence)|apply (formatting|prettier|fmt)|regenerat|prepare release|v?\d+\.\d+\.\d+)", re.I)
          MICRO = re.compile(r"^(wip|x+|\.+|fix|update|tweak|tmp|test|stuff|more|misc|changes?|save)$", re.I)
          KINDS = ("substantive", "merge", "automated", "micro")
          DAYS_BACK = 730                           # how far back commits are read
          WINDOWS = (30, 90, 180, 365)              # the table covers these many days
          LONGEST_BREAK = dt.timedelta(hours=2)     # a stretch ends when no commit lands for longer than this
          OVERNIGHT = (23, 0, 1, 2, 3, 4, 5, 6)
          BANDS = {"day, 07:00 to 18:00": range(7, 18), "evening, 18:00 to 23:00": range(18, 23),
                   "overnight, 23:00 to 07:00": OVERNIGHT}
          HOUR = dt.timedelta(hours=1)
          CHART_ONLY = ("per_hour", "first_hour_of_day")    # handed on so a chart can be drawn, left out of the tables
          TOKEN = os.environ.get("VELOCITY_RADAR_TOKEN") or sys.exit("VELOCITY_RADAR_TOKEN is empty: add the token as a secret with that name")
          Commit = collections.namedtuple("Commit", "day kind lines when private")

          # ---- 2. READING FROM GITHUB -------------------------------------------------------------------
          REPOSITORIES = """query($after:String){ viewer { repositories(first:100, after:$after,
            ownerAffiliations:OWNER, isFork:false) { pageInfo{ hasNextPage endCursor }
            nodes{ nameWithOwner isPrivate defaultBranchRef{ name } } } } }"""
          HISTORY = """query($owner:String!,$name:String!,$uid:ID!,$since:GitTimestamp!,$after:String){
            repository(owner:$owner,name:$name){ defaultBranchRef{ target{ ... on Commit {
              history(first:100, author:{id:$uid}, since:$since, after:$after){ pageInfo{ hasNextPage endCursor }
                nodes{ oid authoredDate messageHeadline SIZES parents{ totalCount } } } } } } } }"""

          def ask(query, **variables):
              """One request to GitHub with your token. Returns the data, or None after five failed tries."""
              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": "Bearer " + TOKEN, "User-Agent": "velocity-radar-count"})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          data = json.load(response).get("data")
                      if data is not None:
                          return data
                  except urllib.error.HTTPError as error:
                      if error.code == 401:
                          sys.exit("GitHub refused the token: check it has not expired and has Contents: Read-only.")
                  except Exception:
                      pass                          # a dropped connection or a busy server: wait and try again
                  time.sleep(15 * (attempt + 1))
              return None

          def repositories():
              """Every repository you own that the token can read. Forks and empty repositories are left out."""
              found, after = [], None
              while True:
                  data = ask(REPOSITORIES, after=after) or sys.exit("could not list your repositories")
                  page = data["viewer"]["repositories"]
                  found += [r for r in page["nodes"] if r["defaultBranchRef"]]
                  if not page["pageInfo"]["hasNextPage"]:
                      return found
                  after = page["pageInfo"]["endCursor"]

          def commits_in(repository, author_id, since):
              """Your commits on one repository's default branch. None if the repository could not be read."""
              owner, name = repository["nameWithOwner"].split("/", 1)
              found, after, sizes = [], None, "additions deletions"
              while True:
                  data = ask(HISTORY.replace("SIZES", sizes), owner=owner, name=name, uid=author_id, since=since,
                             after=after)
                  if data is None and sizes:
                      sizes = ""                    # a very large repository: read it again without line counts
                      continue
                  if data is None:
                      return None
                  branch = (data["repository"] or {}).get("defaultBranchRef") or {}
                  history = (branch.get("target") or {}).get("history") or {}
                  found += history.get("nodes") or []
                  if not (history.get("pageInfo") or {}).get("hasNextPage"):
                      return found
                  after = history["pageInfo"]["endCursor"]

          def kind(is_merge, subject):
              """Sorts a commit by its parent count and the first line of its message, and by nothing else."""
              text = (subject or "").strip()
              if is_merge:
                  return "merge"
              if AUTO.search(text):
                  return "automated"                # chores, releases, version bumps, recorded test runs
              if len(text) <= 3 or MICRO.match(text):
                  return "micro"                    # "wip", "fix", "."
              return "substantive"

          def read_commits(through):
              """Your commits up to the last complete day. A commit that sits in two repositories counts once."""
              me = ask("{ viewer { id login } }") or sys.exit("could not read who the token belongs to")
              since = (through - dt.timedelta(days=DAYS_BACK - 1)).isoformat() + "T00:00:00Z"
              repos, commits, unread = repositories(), {}, 0
              for repo in repos:
                  nodes = commits_in(repo, me["viewer"]["id"], since)
                  if nodes is None:
                      unread += 1
                      continue
                  for node in nodes:
                      when = dt.datetime.fromisoformat(node["authoredDate"].replace("Z", "+00:00")).astimezone(dt.timezone.utc)
                      lines = None if node.get("additions") is None else node["additions"] + node["deletions"]
                      is_merge = node["parents"]["totalCount"] > 1
                      commits.setdefault(node["oid"], Commit(when.date().isoformat(), kind(is_merge, node["messageHeadline"]),
                                                             lines, when, repo["isPrivate"]))
              counted = {"read": len(repos) - unread, "private": sum(r["isPrivate"] for r in repos), "could_not_read": unread}
              kept = [c for c in commits.values() if c.day <= through.isoformat()]
              return me["viewer"]["login"], since[:10], kept, counted

          # ---- 3. ADDING UP -----------------------------------------------------------------------------
          def median_lines(commits):
              """The size in lines of the middle commit, or None with fewer than ten commits to go on."""
              lines = [c.lines for c in commits if c.lines is not None]
              return round(statistics.median(lines)) if len(lines) >= 10 else None

          def totals_by_day(commits):
              """For each day: how many commits of each kind, and the line count of each substantive commit."""
              days = collections.defaultdict(lambda: dict({k: 0 for k in KINDS}, lines=[]))
              for c in commits:
                  days[c.day][c.kind] += 1
                  if c.kind == "substantive" and c.lines is not None:
                      days[c.day]["lines"].append(c.lines)
              return {day: dict(total, lines=sorted(total["lines"])) for day, total in sorted(days.items())}

          def window_table(commits, through):
              """One row for each of the last 30, 90, 180 and 365 days, with commit size in all repositories and public ones."""
              rows = []
              for span in WINDOWS:
                  first_day = (through - dt.timedelta(days=span - 1)).isoformat()
                  inside = [c for c in commits if c.day >= first_day]
                  substantive = [c for c in inside if c.kind == "substantive"]
                  public = [c for c in substantive if not c.private]
                  rows.append({"days": span, "commits": len(inside), **{k: sum(c.kind == k for c in inside) for k in KINDS},
                               "median_lines": median_lines(substantive), "public_substantive": len(public),
                               "median_lines_public_only": median_lines(public)})
              return rows

          def longest_chain(times, longest_gap):
              """The first and last of the longest chain of times in which no gap between neighbours exceeds longest_gap."""
              times = sorted(times)
              best, start = (times[0], times[0]), times[0]
              for earlier, later in zip(times, times[1:] + [None]):
                  if later is None or later - earlier > longest_gap:
                      if earlier - start > best[1] - best[0]:
                          best = (start, earlier)
                      start = later
              return best

          def longest_run(commits, clock):
              """The longest unbroken run of clock hours that each hold at least one commit."""
              per_hour = collections.Counter(c.when.replace(minute=0, second=0, microsecond=0) for c in commits)
              first, last = longest_chain(per_hour, HOUR)
              each = [per_hour[first + HOUR * i] for i in range(int((last - first) / HOUR) + 1)]
              return {"hours": len(each), "from": clock(first).strftime("%Y-%m-%d %H:%M"),
                      "to": clock(last + HOUR).strftime("%Y-%m-%d %H:%M"), "commits": sum(each), "fewest_in_an_hour": min(each),
                      "median_in_an_hour": statistics.median(each), "first_hour_of_day": clock(first).hour, "per_hour": each[:120]}

          def longest_stretch(commits, clock):
              """The longest stretch of commits with no break longer than LONGEST_BREAK between one and the next."""
              times = sorted(c.when for c in commits)
              first, last = longest_chain(times, LONGEST_BREAK)
              inside = [t for t in times if first <= t <= last]
              longest_break = max((later - earlier for earlier, later in zip(inside, inside[1:])), default=dt.timedelta(0))
              return {"hours": round((last - first) / HOUR, 1), "from": clock(first).strftime("%Y-%m-%d %H:%M"),
                      "to": clock(last).strftime("%Y-%m-%d %H:%M"), "commits": len(inside),
                      "longest_break_minutes": round(longest_break / dt.timedelta(minutes=1))}

          def hours_of_the_day(commits, clock, zone_given):
              """On how many days commits landed in many different hours; with a time zone, also the bands and the nights."""
              hours_by_day, hours_by_night = collections.defaultdict(set), collections.defaultdict(set)
              by_hour = collections.Counter()
              for c in commits:
                  local = clock(c.when)
                  by_hour[local.hour] += 1
                  hours_by_day[local.date()].add(local.hour)
                  if local.hour in OVERNIGHT:       # 23:00 opens the night of that day; 00:00 to 06:59 close the night before
                      night = local.date() if local.hour == 23 else local.date() - dt.timedelta(days=1)
                      hours_by_night[night].add(local.hour)
              spread = [len(hours) for hours in hours_by_day.values()]
              result = {"days": len(spread), "median_hours_a_day": statistics.median(spread),
                        "days_with_at_least": {str(n): sum(s >= n for s in spread) for n in (8, 12, 16, 20, 24)}}
              if zone_given:
                  result["bands"] = []
                  for band, hours in BANDS.items():
                      share = 100 * sum(by_hour[h] for h in hours) / len(commits)
                      result["bands"].append({"band": band, "commits": sum(by_hour[h] for h in hours),
                                              "percent_of_commits": round(share, 1),
                                              "percent_per_hour_of_the_band": round(share / len(hours), 2)})
                  result["nights"] = {"nights_with_a_commit": len(hours_by_night),
                                      "with_one_in_4_or_more_of_the_8_hours": sum(len(h) >= 4 for h in hours_by_night.values()),
                                      "with_one_in_all_8_hours": sum(len(h) == 8 for h in hours_by_night.values())}
              return result

          # ---- 4. SHOWING YOU THE RESULT ----------------------------------------------------------------
          def table(rows):
              """A Markdown table drawn straight from a list of records, so the page shows exactly what is in the totals."""
              def cell(value):
                  return "" if value is None else f"{value:,}" if isinstance(value, int) else str(value)
              columns = list(dict.fromkeys(name for row in rows for name in row))
              lines = ["", "| " + " | ".join(name.replace("_", " ") for name in columns) + " |", "|" + "---|" * len(columns)]
              return lines + ["| " + " | ".join(cell(row.get(name)) for name in columns) + " |" for row in rows]

          def summary(totals):
              """The page you see when the run finishes. Everything on it is also in the totals handed to job 2."""
              counted, hours = totals["repositories"], totals["hours_of_the_day"]
              text = [f"## Velocity Radar count for {totals['login']}", "",
                      f"Counted through **{totals['counted_through']}** (complete UTC days), from {totals['since']}, "
                      f"in {counted['read']} repositories, {counted['private']} of them private, "
                      f"{counted['could_not_read']} not readable."]
              text += table(totals["windows"])
              if totals["longest"]:
                  text += ["", f"### Round the clock, last 365 days ({totals['clock']}): substantive commits, and any commit"]
                  text += table([{"longest": name.replace("_", ", "), **{k: v for k, v in found.items() if k not in CHART_ONLY}}
                                 for name, found in totals["longest"].items()])
                  text += ["", f"Days with a substantive commit: {hours['days']}. The middle day had one in "
                           f"{hours['median_hours_a_day']:g} different hours. "
                           "Days with one in at least 8, 12, 16, 20 and 24 hours: "
                           + ", ".join(map(str, hours["days_with_at_least"].values())) + "."]
              if hours.get("bands"):
                  text += ["", "### Day, evening, overnight: substantive commits"]
                  text += table(hours["bands"]) + table([hours["nights"]])
              elif totals["longest"]:
                  text += ["", "_No time zone was given, so there is no day, evening and overnight split, and hours are UTC._"]
              return "\n".join(text + ["", "**Nothing was sent.** Sending is not open yet."]) + "\n"

          def hand_on(totals):
              """Passes the totals to job 2. A job can pass on 1 MB: beyond that the line counts are left out."""
              pack = lambda: base64.b64encode(gzip.compress(json.dumps(totals, separators=(",", ":")).encode())).decode()
              if len(pack()) > 900_000:
                  totals["days"] = {day: {k: v for k, v in total.items() if k != "lines"} for day, total in totals["days"].items()}
                  totals["line_counts_left_out"] = True
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("totals=" + pack() + "\n")

          # ---- 5. THE RUN -------------------------------------------------------------------------------
          def main():
              """Reads, adds up, hands the totals to job 2 and shows them to you. Nothing else happens in this job."""
              through = dt.datetime.now(dt.timezone.utc).date() - dt.timedelta(days=1)       # complete days only
              zone_name = os.environ.get("TIMEZONE", "").strip()
              try:
                  zone = ZoneInfo(zone_name) if zone_name else None
              except Exception:
                  zone = None
                  print(f"time zone {zone_name!r} was not recognised, so hours are shown in UTC")
              clock = (lambda when: when.astimezone(zone)) if zone else (lambda when: when)

              login, since, commits, counted = read_commits(through)
              year = [c for c in commits if c.day >= (through - dt.timedelta(days=364)).isoformat()]
              substantive = [c for c in year if c.kind == "substantive"]
              totals = {"schema": 3, "method_version": METHOD_VERSION, "login": login, "since": since,
                        "counted_through": through.isoformat(), "repositories": counted, "clock": zone_name if zone else "UTC",
                        "windows": window_table(commits, through), "longest": {}, "hours_of_the_day": {},
                        "days": totals_by_day(commits)}
              if substantive:
                  totals["longest"] = {"run_substantive": longest_run(substantive, clock), "run_any": longest_run(year, clock),
                                       "stretch_substantive": longest_stretch(substantive, clock),
                                       "stretch_any": longest_stretch(year, clock)}
                  totals["hours_of_the_day"] = hours_of_the_day(substantive, clock, zone is not None)
              hand_on(totals)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as page:
                  page.write(summary(totals))
              print(f"{login}: {len(commits):,} commits counted through {through}. Nothing sent anywhere.")

          main()
          PY

  witness:
    name: Witness (never sees your token, sends nothing)
    needs: count
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Show what GitHub would vouch for about this run
        env:
          TOTALS: ${{ needs.count.outputs.totals }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request

          VOUCHED = ("repository", "actor", "job_workflow_ref", "job_workflow_sha", "runner_environment", "aud")

          def signed_claims():
              """Asks GitHub for a signed token about this run and returns what it says. The token itself is never shown."""
              request = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=https://velocity.id8.one",
                                               headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              payload = json.load(urllib.request.urlopen(request, timeout=30))["value"].split(".")[1]
              return json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))

          def main():
              """Shows what GitHub would sign about this run, and that the totals arrived. Sends nothing."""
              try:
                  claims = {name: value for name, value in signed_claims().items() if name in VOUCHED}
              except Exception as problem:
                  claims = {"note": f"no signed run token ({type(problem).__name__}): your own file needs 'id-token: write'"}
              text = (f"## What GitHub would vouch for about this run\n\n```\n{json.dumps(claims, indent=1)}\n```\n\n"
                      f"The totals reached this job ({len(os.environ['TOTALS']):,} characters, packed) and **nothing was sent**.\n")
              print(text)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as page:
                  page.write(text)

          main()
          PY
