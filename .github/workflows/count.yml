          import base64, datetime as dt, gzip, hashlib, json, os, sys, time
          import urllib.error, urllib.request
          from zoneinfo import ZoneInfo

          # ---- 1. SETTINGS ------------------------------------------------------------------------------
          # The sha256 of the two files written above. Nothing in them runs until both match.
          METHOD_VERSION = 6
          MEASURES_SHA256 = "e3c5d30838954f7f5fd6a5df4c3868be5bd02b297f21f956ee46892ce8238aed"
          GOLDEN_SHA256 = "8683b344f47d30cccc4276c56c9a9d7b36ce5ff639f23fb0224aac515d3c73c6"
          DAYS_BACK = 730                           # how far back commits and the contribution calendar are read
          PACKED_MAX = 900_000                      # job 2 can be handed 1 MB; Velocity Radar reads at most this much
          UNPACKED_MAX = 8_000_000
          FOLDER = os.path.join(os.environ["RUNNER_TEMP"], "velocity-radar")
          TOKEN = os.environ.get("VELOCITY_RADAR_TOKEN") or sys.exit("VELOCITY_RADAR_TOKEN is empty: add the token as a secret with that name")

          # ---- 2. THE FORMULAS, CHECKED BEFORE THEY ARE USED ---------------------------------------------
          def load_formulas():
              """Hashes measures.py and golden.json before anything in them runs, then runs every golden case with
              GitHub's Python. Stops the run on any difference. Returns measures.py and the number of cases passed."""
              for name, want in (("measures.py", MEASURES_SHA256), ("method/golden.json", GOLDEN_SHA256)):
                  got = hashlib.sha256(open(os.path.join(FOLDER, name), "rb").read()).hexdigest()
                  if got != want:
                      sys.exit(f"{name} is not the file this release carries (sha256 {got}), so nothing was counted")
              sys.path.insert(0, FOLDER)
              import measures
              golden = json.load(open(os.path.join(FOLDER, "method", "golden.json")))
              passed = 0
              for case in golden["cases"]:
                  try:
                      got = json.loads(json.dumps(getattr(measures, case["fn"])(**case["args"])))
                  except Exception as problem:
                      got = f"raised {type(problem).__name__}"
                  passed += got == case["expect"]
              if measures.METHOD_VERSION != METHOD_VERSION or golden["method_version"] != METHOD_VERSION:
                  sys.exit("measures.py and its golden cases are not method version " + str(METHOD_VERSION))
              if passed != len(golden["cases"]):
                  sys.exit(f"{passed} of {len(golden['cases'])} golden cases passed on this runner, so nothing was counted")
              return measures, passed

          # ---- 3. READING FROM GITHUB -------------------------------------------------------------------
          # Repositories are asked for by id and read through node(id:), so no repository name is ever asked for.
          REPOSITORIES = """query($after:String){ viewer { repositories(first:100, after:$after,
            ownerAffiliations:OWNER, isFork:false) { pageInfo{ hasNextPage endCursor }
            nodes{ id isPrivate defaultBranchRef{ id } } } } }"""
          HISTORY = """query($id:ID!,$uid:ID!,$since:GitTimestamp!,$after:String){
            node(id:$id){ ... on Repository { defaultBranchRef{ target{ ... on Commit {
              history(first:100, author:{id:$uid}, since:$since, after:$after){ pageInfo{ hasNextPage endCursor }
                nodes{ oid authoredDate messageHeadline SIZES parents{ totalCount } } } } } } } } }"""
          CALENDAR = """query($from:DateTime!,$to:DateTime!){ viewer { contributionsCollection(from:$from, to:$to){
            contributionCalendar{ weeks{ contributionDays{ date contributionCount } } } } } }"""

          def ask(query, **variables):
              """One request to GitHub with your token. Returns the data, or None after five failed tries."""
              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": "Bearer " + TOKEN, "User-Agent": "velocity-radar-count"})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          data = json.load(response).get("data")
                      if data is not None:
                          return data
                  except urllib.error.HTTPError as error:
                      if error.code == 401:
                          sys.exit("GitHub refused the token: check it has not expired and has Contents: Read-only.")
                  except Exception:
                      pass                          # a dropped connection or a busy server: wait and try again
                  time.sleep(15 * (attempt + 1))
              return None

          def repositories():
              """Every repository you own that the token can read, as its id and whether it is private, and nothing
              else from the answer. Forks and empty repositories are left out."""
              found, after = [], None
              while True:
                  data = ask(REPOSITORIES, after=after) or sys.exit("could not list your repositories")
                  page = data["viewer"]["repositories"]
                  found += [{"id": r["id"], "isPrivate": r["isPrivate"]} for r in page["nodes"] if r["defaultBranchRef"]]
                  if not page["pageInfo"]["hasNextPage"]:
                      return found
                  after = page["pageInfo"]["endCursor"]

          def commits_in(repository, author_id, since):
              """Your commits on one repository's default branch. None if the repository could not be read."""
              found, after, sizes = [], None, "additions deletions"
              while True:
                  data = ask(HISTORY.replace("SIZES", sizes), id=repository["id"], uid=author_id, since=since, after=after)
                  if data is None and sizes:
                      sizes = ""                    # a very large repository: read it again without line counts
                      continue
                  if data is None:
                      return None
                  branch = (data["node"] or {}).get("defaultBranchRef") or {}
                  history = (branch.get("target") or {}).get("history") or {}
                  found += history.get("nodes") or []
                  if not (history.get("pageInfo") or {}).get("hasNextPage"):
                      return found
                  after = history["pageInfo"]["endCursor"]

          def read_commits(since, kind):
              """Your commits since the first day read, one row each as measures.py takes them: when it was authored,
              its kind, its lines and whether its repository is private. A commit in two repositories counts once. The
              first line of each message is used once, to find the commit's kind, and then dropped."""
              me = ask("{ viewer { id login } }") or sys.exit("could not read who the token belongs to")
              repos, rows, unread = repositories(), {}, 0
              for repo in repos:
                  nodes = commits_in(repo, me["viewer"]["id"], since.isoformat() + "T00:00:00Z")
                  if nodes is None:
                      unread += 1
                      continue
                  for node in nodes:
                      lines = None if node.get("additions") is None else node["additions"] + node["deletions"]
                      rows.setdefault(node["oid"], [node["authoredDate"], kind(node["parents"]["totalCount"] > 1, node["messageHeadline"]),
                                                    lines, repo["isPrivate"]])
              counted = {"read": len(repos) - unread, "private": sum(r["isPrivate"] for r in repos), "could_not_read": unread}
              return me["viewer"]["login"], list(rows.values()), counted

          def calendar(since, through):
              """Your contribution calendar as your token reads it: one count a day from since to through. Asked about
              a third of a year at a time, as the site asks, because one long window can time out on a busy account."""
              counts, first = {}, since
              while first <= through:
                  last = min(first + dt.timedelta(days=121), through)
                  data = (ask(CALENDAR, **{"from": first.isoformat() + "T00:00:00Z", "to": last.isoformat() + "T23:59:59Z"})
                          or sys.exit("could not read your contribution calendar"))
                  for week in data["viewer"]["contributionsCollection"]["contributionCalendar"]["weeks"]:
                      for day in week["contributionDays"]:
                          counts[day["date"]] = day["contributionCount"]
                  first = last + dt.timedelta(days=1)
              days = [(since + dt.timedelta(days=i)).isoformat() for i in range((through - since).days + 1)]
              return {"from": since.isoformat(), "counts": [counts.get(day, 0) for day in days]}

          # ---- 4. YOUR TIME ZONE ------------------------------------------------------------------------
          def offsets(zone, first, last):
              """Your time zone's offset from UTC in minutes at first, and at every change up to last, as measures.py
              takes it: zoneinfo is asked every quarter of an hour and each change is narrowed down to the second.
              measures.py may not read files, and zoneinfo reads the zone's rules from them, so this is done here."""
              stamp = lambda when: when.strftime("%Y-%m-%dT%H:%M:%SZ")
              minutes = lambda when: int(when.astimezone(zone).utcoffset() / dt.timedelta(minutes=1))
              found, when = [[stamp(first), minutes(first)]], first
              while when < last:
                  later = when + dt.timedelta(minutes=15)
                  if minutes(later) != found[-1][1]:
                      low, high = when, later
                      while high - low > dt.timedelta(seconds=1):
                          middle = low + dt.timedelta(seconds=(high - low) // dt.timedelta(seconds=1) // 2)
                          if minutes(middle) == found[-1][1]:
                              low = middle
                          else:
                              high = middle
                      found.append([stamp(high), minutes(high)])
                  when = later
              return found

          # ---- 5. SHOWING YOU THE RESULT ----------------------------------------------------------------
          CHART_ONLY = ("per_hour", "first_hour_of_day")    # handed on so a chart can be drawn, left out of the tables

          def table(rows):
              """A Markdown table drawn straight from a list of records, so the page shows exactly what is in the totals."""
              def cell(value):
                  return "" if value is None else f"{value:,}" if isinstance(value, int) else str(value)
              columns = list(dict.fromkeys(name for row in rows for name in row))
              lines = ["", "| " + " | ".join(name.replace("_", " ") for name in columns) + " |", "|" + "---|" * len(columns)]
              return lines + ["| " + " | ".join(cell(row.get(name)) for name in columns) + " |" for row in rows]

          def formulas_line(totals):
              """The one line that says which formulas ran: the method version, the file's hash and the golden cases."""
              return (f"method version {totals['method_version']} · measures.py sha256 {totals['measures_sha256']} · "
                      f"{totals['golden_passed']} of {totals['golden_passed']} golden cases passed")

          def summary(totals):
              """The page you see when the run finishes. Everything on it is also in the totals handed to job 2."""
              counted, figures = totals["repositories"], totals["figures"]
              hours = figures["hours_of_the_day"]
              text = [f"## Velocity Radar count for {totals['login']}", "",
                      f"Counted through **{totals['counted_through']}** (complete UTC days), from {totals['since']}, "
                      f"in {counted['read']} repositories, {counted['private']} of them private, "
                      f"{counted['could_not_read']} not readable.", "", "`" + formulas_line(totals) + "`",
                      "", "### Substantive commits per active day"]
              text += table(figures["ranges"])
              if figures["stretches"]:
                  text += ["", "### Stretches of 30 active days, oldest first: substantive commits per active day, "
                           "and median lines per substantive commit"]
                  text += table(figures["stretches"])
              text += ["", "### Last 30, 90, 180 and 365 days"] + table(figures["windows"])
              if figures["longest"]:
                  text += ["", f"### Round the clock, last 365 days ({totals['clock']}): substantive commits, and any commit"]
                  text += table([{"longest": name.replace("_", ", "), **{k: v for k, v in found.items() if k not in CHART_ONLY}}
                                 for name, found in figures["longest"].items()])
                  text += ["", f"Days with a substantive commit: {hours['days']}. The middle day had one in "
                           f"{hours['median_hours_a_day']:g} different hours. "
                           "Days with one in at least 8, 12, 16, 20 and 24 hours: "
                           + ", ".join(map(str, hours["days_with_at_least"].values())) + "."]
              if hours.get("bands"):
                  text += ["", "### Day, evening, overnight: substantive commits"]
                  text += table(hours["bands"]) + table([hours["nights"]])
              elif figures["longest"]:
                  text += ["", "_No time zone was given, so there is no day, evening and overnight split, and hours are UTC._"]
              if totals.get("line_counts_left_out"):
                  text += ["", "_Some line counts by day were left out to fit what job 2 can be handed: "
                           + ", ".join(totals["line_counts_left_out"]) + ". The figures above were worked out before, with all of them._"]
              return "\n".join(text + ["", "**Nothing was sent.** Velocity Radar reads these totals from this run's log "
                                       "only if you press Check my run."]) + "\n"

          def hand_on(totals):
              """Passes the totals to job 2. Past PACKED_MAX packed characters or UNPACKED_MAX unpacked, the public line
              counts by day are left out, then the rest of them; the figures were worked out before and stay whole."""
              plain = lambda: json.dumps(totals, separators=(",", ":")).encode()
              pack = lambda: base64.b64encode(gzip.compress(plain())).decode()
              for key in ("public_lines", "lines"):
                  if len(pack()) <= PACKED_MAX and len(plain()) <= UNPACKED_MAX:
                      break
                  totals["days"] = {day: {k: v for k, v in total.items() if k != key} for day, total in totals["days"].items()}
                  totals.setdefault("line_counts_left_out", []).append(key)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("totals=" + pack() + "\n")

          # ---- 6. THE RUN -------------------------------------------------------------------------------
          def main():
              """Checks the formulas, reads, works out every figure with measures.py, hands the totals to job 2 and
              shows them to you. Nothing else happens in this job."""
              measures, passed = load_formulas()
              print(f"method version {METHOD_VERSION} · measures.py sha256 {MEASURES_SHA256} · {passed} of {passed} golden cases passed")
              through = dt.datetime.now(dt.timezone.utc).date() - dt.timedelta(days=1)       # complete days only
              since = through - dt.timedelta(days=DAYS_BACK - 1)
              zone_name = os.environ.get("TIMEZONE", "").strip()
              try:
                  zone = ZoneInfo(zone_name) if zone_name else None
              except Exception:
                  zone = None
                  print(f"time zone {zone_name!r} was not recognised, so hours are shown in UTC")

              login, rows, counted = read_commits(since, measures.commit_kind)
              year_start = dt.datetime.combine(through - dt.timedelta(days=365), dt.time(), dt.timezone.utc)
              to_local = offsets(zone, year_start, year_start + dt.timedelta(days=368)) if zone else []
              days = measures.commit_days(rows, through.isoformat())
              contributions = calendar(since, through)
              figures = measures.counted_figures(days, contributions, through.isoformat())
              figures.update(measures.rhythm_figures(rows, through.isoformat(), to_local, zone is not None))
              totals = {"schema": 4, "method_version": measures.METHOD_VERSION, "measures_sha256": MEASURES_SHA256,
                        "golden_sha256": GOLDEN_SHA256, "golden_passed": passed, "login": login, "since": since.isoformat(),
                        "counted_through": through.isoformat(), "clock": zone_name if zone else "UTC", "repositories": counted,
                        "figures": figures, "calendar": contributions, "days": days}
              hand_on(totals)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as page:
                  page.write(summary(totals))
              print(f"{login}: {len(rows):,} commits read, counted through {through}. Nothing sent anywhere.")

          main()
          PY

  witness:
    name: Witness (never sees your token, sends nothing)
    needs: count
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Show what GitHub would vouch for about this run
        env:
          TOTALS: ${{ needs.count.outputs.totals }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request

          VOUCHED = ("repository", "actor", "job_workflow_ref", "job_workflow_sha", "runner_environment", "aud")

          def signed_claims():
              """Asks GitHub for a signed token about this run and returns what it says. The token itself is never shown."""
              request = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=https://velocity.id8.one",
                                               headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              payload = json.load(urllib.request.urlopen(request, timeout=30))["value"].split(".")[1]
              return json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))

          def main():
              """Shows what GitHub would sign about this run, and that the totals arrived. Sends nothing."""
              try:
                  claims = {name: value for name, value in signed_claims().items() if name in VOUCHED}
              except Exception as problem:
                  claims = {"note": f"no signed run token ({type(problem).__name__}): your own file needs 'id-token: write'"}
              text = (f"## What GitHub would vouch for about this run\n\n```\n{json.dumps(claims, indent=1)}\n```\n\n"
                      f"The totals reached this job ({len(os.environ['TOTALS']):,} characters, packed) and **nothing was sent**.\n")
              print(text)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as page:
                  page.write(text)

          main()
          PY
